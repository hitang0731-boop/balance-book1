<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb"><title>💰 我的記帳</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#687386;--line:#e5e9f0;--blue:#2563eb;--green:#16834b;--red:#d33b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 14px 40px}h1{margin:4px 0;font-size:26px}.sub{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 25px #1e2d4610}.hero{background:linear-gradient(135deg,#fff,#eef4ff)}.label{font-size:12px;color:var(--muted)}.big{font-size:36px;font-weight:800;margin:4px 0 12px}.grid2,.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{grid-template-columns:repeat(3,1fr)}.mini,.stat{border:1px solid var(--line);background:#f8fafc;border-radius:13px;padding:10px}.mini b,.stat strong{display:block;font-size:18px;margin-top:3px}.income{color:var(--green)}.expense{color:var(--red)}.title{font-size:18px;font-weight:800;margin-bottom:12px}.monthbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}.monthbar button,.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;height:44px}.monthbar select,input,select{height:44px;width:100%;border:1px solid #d8dee8;border-radius:11px;background:#fff;padding:0 10px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.tabs,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700}.tab.on{background:#eef4ff;border-color:#9abaff;color:var(--blue)}.primary{height:46px;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;margin-top:10px}.chart{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.pie{width:180px;height:180px;border-radius:50%;margin:auto;position:relative}.pie:after{content:"";position:absolute;inset:43px;background:#fff;border-radius:50%;border:1px solid var(--line)}.legend{display:flex;flex-direction:column;gap:8px}.legend div{display:flex;align-items:center;gap:7px;font-size:12px}.dot{width:11px;height:11px;border-radius:50%}.legend span:nth-child(2){flex:1}.rank{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.num{width:24px;text-align:center;font-weight:800;color:var(--muted)}.rmain{flex:1}.bar{height:7px;background:#edf0f5;border-radius:99px;margin-top:5px;overflow:hidden}.fill{height:100%;background:var(--red);border-radius:99px}.ramt{font-weight:800;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.record{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.rinfo{flex:1;min-width:0}.rtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px}.amt{font-weight:800;white-space:nowrap}.del{border:0;background:#fff0f2;color:var(--red);width:35px;height:35px;border-radius:9px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar select{flex:1;min-width:145px}.muted{text-align:center;color:var(--muted);padding:16px}.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}@media(max-width:620px){.chart{grid-template-columns:1fr}.pie{width:170px;height:170px}}
</style></head>
<body><div class="wrap">
<h1>💰 我的記帳</h1><div class="sub">收入、支出、分類統計與月份管理</div>
<section class="card hero"><div class="label">目前總餘額</div><div class="big" id="overall">$0</div><div class="grid2"><div class="mini"><div class="label">初始餘額</div><b id="initial">$0</b></div><div class="mini"><div class="label">紀錄筆數</div><b id="count">0</b></div></div></section>
<section class="card"><div class="title">📅 月份切換</div><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><select id="month" onchange="pickMonth(this.value)"></select><button onclick="moveMonth(1)">›</button></div><div class="stats" style="margin-top:10px"><div class="stat"><div class="label">本月收入</div><strong class="income" id="mi">$0</strong></div><div class="stat"><div class="label">本月支出</div><strong class="expense" id="me">$0</strong></div><div class="stat"><div class="label">本月餘額</div><strong id="mn">$0</strong></div></div></section>
<section class="card"><div class="title">➕ 新增紀錄</div><div class="tabs"><button id="ib" class="tab on" onclick="setType('income')">收入</button><button id="eb" class="tab" onclick="setType('expense')">支出</button></div><div class="formgrid"><div><label>日期</label><input id="date" type="date"></div><div><label>分類</label><select id="cat"></select></div><div><label>金額</label><input id="amount" type="number" min="0" step="1" inputmode="decimal" placeholder="例如 500"></div><div><label>備註</label><input id="note" maxlength="50" placeholder="例如 午餐"></div></div><button class="primary" onclick="add()">新增紀錄</button></section>
<section class="card"><div class="title">⚙️ 初始餘額</div><div class="formgrid"><div><label>初始餘額</label><input id="initAmt" type="number" step="1" inputmode="decimal"></div><div><label>初始日期</label><input id="initDate" type="date"></div></div><button class="primary" onclick="saveInitial()">儲存初始餘額</button><div class="hint">初始餘額會計入總餘額，但不會算進某一月份的收入或支出。</div></section>
<section class="card"><div class="title">🥧 分類圓餅圖</div><div class="two"><button class="secondary" onclick="setPie('expense')">支出分類</button><button class="secondary" onclick="setPie('income')">收入分類</button></div><div class="chart"><div class="pie" id="pie"></div><div class="legend" id="legend"></div></div></section>
<section class="card"><div class="title">🏆 分類排行榜</div><div class="two"><button class="secondary" onclick="setRank('expense')">支出排行榜</button><button class="secondary" onclick="setRank('income')">收入排行榜</button></div><div id="rank"></div></section>
<section class="card"><div class="title">📊 分類餘額</div><div style="overflow:auto"><table><thead><tr><th>分類</th><th>收入</th><th>支出</th><th>餘額</th></tr></thead><tbody id="table"></tbody></table></div></section>
<section class="card"><div class="title">🧾 本月紀錄</div><div class="toolbar"><select id="filter" onchange="renderRecords()"><option value="all">全部</option><option value="income">只看收入</option><option value="expense">只看支出</option></select><button class="secondary" onclick="exportData()">匯出</button><button class="secondary" onclick="clearRecords()">清除紀錄</button></div><div id="records"></div></section>
</div>
<script>
const KEY='balance_book_shared_category_v1';
const cats=['餐飲','交通','娛樂','購物','日用品','住房','醫療','薪資','獎金','兼職','投資','其他'];
const colors=['#2563eb','#16a34a','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#6366f1','#64748b'];
let data=load(),month=today().slice(0,7),type='income',pieType='expense',rankType='expense';
function today(){return new Date().toISOString().slice(0,10)}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&Array.isArray(x.records)?x:{initialBalance:0,initialDate:today(),records:[]}}catch(e){return{initialBalance:0,initialDate:today(),records:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function fmt(n){return '$'+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function sum(t,m=null){return data.records.filter(r=>r.type===t&&(!m||r.date.slice(0,7)===m)).reduce((a,r)=>a+Number(r.amount),0)}
function mr(){return data.records.filter(r=>r.date.slice(0,7)===month)}
function setType(t){type=t;ib.classList.toggle('on',t==='income');eb.classList.toggle('on',t==='expense')}
function setPie(t){pieType=t;renderPie()}
function setRank(t){rankType=t;renderRank()}
function pickMonth(m){month=m;render()}
function moveMonth(n){let [y,m]=month.split('-').map(Number);let d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function add(){let dateEl=document.getElementById('date'),cat=document.getElementById('cat').value,a=Number(document.getElementById('amount').value),note=document.getElementById('note').value.trim();if(!dateEl.value)return alert('請選擇日期');if(a<=0)return alert('請輸入大於 0 的金額');data.records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),type,date:dateEl.value,category:cat,amount:a,note});save();month=dateEl.value.slice(0,7);document.getElementById('amount').value='';document.getElementById('note').value='';render()}
function saveInitial(){data.initialBalance=Number(document.getElementById('initAmt').value)||0;data.initialDate=document.getElementById('initDate').value||today();save();render();alert('初始餘額已儲存')}
function del(id){if(!confirm('確定要刪除這筆紀錄嗎？'))return;data.records=data.records.filter(r=>r.id!==id);save();render()}
function clearRecords(){if(!confirm('確定清除全部收入與支出紀錄嗎？'))return;data.records=[];save();render()}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='我的記帳資料.json';a.click();URL.revokeObjectURL(a.href)}
function months(){let s=new Set(data.records.map(r=>r.date.slice(0,7)));s.add(month);s.add(today().slice(0,7));return [...s].sort().reverse()}
function renderMonth(){let s=document.getElementById('month');s.innerHTML=months().map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${m.slice(5)} 月</option>`).join('');s.value=month}
function renderSummary(){let inc=sum('income'),exp=sum('expense'),bal=data.initialBalance+inc-exp;overall.textContent=fmt(bal);initial.textContent=fmt(data.initialBalance);count.textContent=data.records.length;let a=sum('income',month),b=sum('expense',month),n=a-b;mi.textContent=fmt(a);me.textContent=fmt(b);mn.textContent=fmt(n);mn.className=n>=0?'income':'expense'}
function renderTable(){let rows=cats.map(c=>{let i=mr().filter(r=>r.category===c&&r.type==='income').reduce((a,r)=>a+r.amount,0),e=mr().filter(r=>r.category===c&&r.type==='expense').reduce((a,r)=>a+r.amount,0);return{c,i,e,n:i-e}}).filter(x=>x.i||x.e);table.innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.c)}</td><td class="income">${fmt(x.i)}</td><td class="expense">${fmt(x.e)}</td><td class="${x.n>=0?'income':'expense'}">${fmt(x.n)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">本月尚無分類紀錄</td></tr>'}
function values(t){return cats.map(c=>({c,v:mr().filter(r=>r.category===c&&r.type===t).reduce((a,r)=>a+r.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}
function renderPie(){let v=values(pieType),tot=v.reduce((a,x)=>a+x.v,0);if(!tot){pie.style.background='#e5e7eb';legend.innerHTML='<div class="muted">本月尚無資料</div>';return}let start=0,parts=v.map((x,i)=>{let end=start+x.v/tot*360,p=`${colors[i%colors.length]} ${start}deg ${end}deg`;start=end;return p});pie.style.background=`conic-gradient(${parts.join(',')})`;legend.innerHTML=v.map((x,i)=>`<div><i class="dot" style="background:${colors[i%colors.length]}"></i><span>${esc(x.c)}</span><b>${fmt(x.v)}</b></div>`).join('')}
function renderRank(){let v=values(rankType).slice(0,10),max=v[0]?.v||1;rank.innerHTML=v.length?v.map((x,i)=>`<div class="rank"><div class="num">${i+1}</div><div class="rmain">${esc(x.c)}<div class="bar"><div class="fill" style="width:${x.v/max*100}%"></div></div></div><div class="ramt">${fmt(x.v)}</div></div>`).join(''):'<div class="muted">本月尚無資料</div>'}
function renderRecords(){let f=document.getElementById('filter').value,r=mr().filter(x=>f==='all'||x.type===f).sort((a,b)=>b.date.localeCompare(a.date));records.innerHTML=r.length?r.map(x=>`<div class="record"><div class="rinfo"><div class="rtitle">${esc(x.category)}${x.note?' · '+esc(x.note):''}</div><div class="meta">${x.date} · ${x.type==='income'?'收入':'支出'}</div></div><div class="amt ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'-'}${fmt(x.amount)}</div><button class="del" onclick="del('${x.id}')">刪</button></div>`).join(''):'<div class="muted">本月沒有符合條件的紀錄</div>'}
function render(){renderMonth();renderSummary();renderTable();renderPie();renderRank();renderRecords()}
cat.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');date.value=today();initAmt.value=data.initialBalance;initDate.value=data.initialDate;render();
</script></body></html>
